
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Calendar | Dashboard</title>
    <link rel="stylesheet" href="home.css">
</head>

<body>

    <main class="home-page">

        <header class="home-header">
    <div class="header-top">
        <h1 id="home-greeting">Good morning.</h1>
        <div id="home-clock">--:--</div>
    </div>
    <p id="home-date"></p>
</header>

        <section class="dashboard">

            <div class="home-cards">

                <a class="home-card calendar-card" href="calendar.html">
                    <div class="card-icon">▦</div>
                    <h2>Calendar</h2>
                    <p>Shifts &amp; events</p>
                    <span class="card-arrow" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17 17 7M7 7h10v10"/>
    </svg>
</span>
                </a>

                <a class="home-card finance-card" href="finance.html">
                    <div class="card-icon">▤</div>
                    <h2>Finance</h2>
                    <p>Bills &amp; payments</p>
                    <span class="card-arrow" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17 17 7M7 7h10v10"/>
    </svg>
</span>
                </a>

            </div>

            <div class="dashboard-bottom">

                <section class="weather-section">
                    <h2>Weather</h2>

                    <div id="weather-setup">
                        <p>Enter your ZIP code to see your local weather.</p>

                        <input
                            type="text"
                            id="weather-zip"
                            placeholder="ZIP code"
                            maxlength="5"
                            inputmode="numeric"
                        >

                        <button id="save-weather-zip">Save</button>
                    </div>

                    <p id="weather-error"></p>

                    <div id="weather-display"></div>

                    <button id="change-weather-location">
                        Change Location
                    </button>
                </section>

                <section class="coming-up-section" id="coming-up">
                    <h2>Coming Up</h2>
                    <div id="upcoming-events"></div>
                </section>

            </div>

        </section>

    </main>

    <script src="home.js"></script>

</body>
</html>
